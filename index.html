<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="main">
        <div class="upper_p">
      <input type="text" id="calc" disabled>
      <div id="result_p">
      <span onclick="calculate()" id="result"></span>
      </div>
      </div>
      <div class="lower_p">
      <button onclick="calculate('0')" id="btn0">0️⃣</button>
      <button onclick="calculate('1')" id="btn1">1️⃣</button>
      <button onclick="calculate('2')" id="btn2">2️⃣</button>
      <button onclick="calculate('3')" id="btn3">3️⃣</button>
      <button onclick="calculate('4')" id="btn4">4️⃣</button>
      <button onclick="calculate('5')" id="btn5">5️⃣</button>
      <button onclick="calculate('6')" id="btn6">6️⃣</button>
      <button onclick="calculate('7')" id="btn7">7️⃣</button>
      <button onclick="calculate('8')" id="btn8">8️⃣</button>
      <button onclick="calculate('9')" id="btn9">9️⃣</button>
      <button onclick="calculate('+')" id="plus">➕</button>
      <button onclick="calculate('-')" id="minus">➖</button>
      <button onclick="calculate('/')" id="divide">➗</button>
      <button onclick="calculate('*')" id="multiply">✖️</button>
      <button onclick="calculate('%')" id="modulus">%</button>
      <button onclick="calculate('=')" id="equal">🟰</button>
      <button onclick="calculate('clear')" id="clear">C</button>
      <button onclick="calculate('.')" id="dot">.</button>
      <button onclick="calculate('clearAll')" id="ac">AC</button>
      </div>
    </div>


    <script src="./app.js"></script>
</body>
</html>
